name: 'CI'
on:
  push:
    branches:
      - main
jobs:
  build:
    name: 'Build and Push'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        node: [16, 18, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Node on version ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm run test
