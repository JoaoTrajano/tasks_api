name: 'CI'
on:
  push:
    branches:
      - main
jobs:
  build:
    name: 'Build and Push'
    runs-on: 'ubuntu-latest'

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm run test

      - name: Docker image build
        run: docker build -t tasks_api .
