name: 'CI'
on:
  push:
    branches:
      - main
jobs:
  build:
    name: 'Build and Push'
    runs-on: 'ubuntu-latest'

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm run test

      - name: Generate Tag
        id: generate_tag
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Login Into the container registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker image build
        run: docker build -t joaotrajanosouza/tasks_api:${{ steps.generate_tag.outputs.sha }} .

      - name: Push image
        run: docker push joaotrajanosouza/tasks_api:${{ steps.generate_tag.outputs.sha }}
